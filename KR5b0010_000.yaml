body:
  text: 太上洞玄靈寳觀妙經太上洞玄靈寳天尊說大通經太上洞玄靈寳護諸童子經太上洞玄靈寶觀妙經夫欲觀妙成眞先去邪僻之行外事都絕然後澄静其心所思次束次滅習之既久其心漸閑唯滅動心不滅靜心但凝空心不凝有心静心之上豁然無覆靜心之下寂然無載有事無事常若無心處靜處謹其志唯一若東心太急又却成疾發乎狂癡是其候也心若不動又須放任恒自調適勿令結滯處誼無惡涉事無惱者此是眞静也不以涉事無惱故求多鑒乎靜久神凝天光自發勿舉急求致以乖自然於静境中見無所取若有所取則偽亂眞久而行之自然得道夫得道者心有五時身有七候一時心動多靜少二時心動靜相半三時心靜多動少四時心無事則靜有事還動五時心常與道㝠觸亦不動七候一者心得奠定不雜嚻塵二者賔疾蠲消身心清爽三者填補虧損復命還年四者延齡慶世名曰仙人五者鋉形爲氣名曰眞人六者鋉氣成神名曰神人七者鋉神含道名曰至人其於鑒力隨候益明夫久學静心都無一候但今穢質爼謝方空欲成眞道未之聞也太上洞玄靈寳觀妙經
  hash: sha256:6e05ca4e52593d3d91a9a988fcef65a4026cf3abbb80d1a8753ab7a05b5017b3
